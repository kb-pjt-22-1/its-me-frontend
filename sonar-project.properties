sonar.projectKey=kb-pjt-22-1_its-me-frontend
sonar.organization=kb-pjt-22-1

sonar.sources=src
# 바이너리/생성 자산 - 애초에 소스 분석 대상이 아니라서 전체 제외 (커버리지뿐 아니라 코드 스멜 등 전체 분석에서 빠짐)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,src/images/**,src/assets/fonts/**

sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# 실제 로직이 없거나(빈 파일/순수 레이아웃 래퍼) 앱에서 안 쓰이는(죽은) 코드라 커버리지 대상에서만 빼되,
# 코드 스멜 등 다른 정적 분석은 계속 받는다(sonar.exclusions가 아니라 이 항목을 쓰는 이유).
# - src/config/index.js: 빈 파일, 어디서도 import 안 됨
# - src/stores/counter.js: create-vue 스캐폴드 예제 그대로 남은 미사용 스토어
# - src/layouts/menu/NavBar.vue: Footer.vue로 대체된 뒤 안 쓰이는 죽은 컴포넌트
# - src/layouts/menu/DefaultLayout.vue, src/components/common/PageContainer.vue: 분기 로직 없는 순수 레이아웃 래퍼
sonar.coverage.exclusions=src/config/index.js,src/stores/counter.js,src/layouts/menu/NavBar.vue,src/layouts/menu/DefaultLayout.vue,src/components/common/PageContainer.vue

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
